# Syno Debrid — example for Synology Container Manager (Project) or docker compose.
services:
  syno-debrid:
    image: ghcr.io/piitaya/syno-debrid:latest
    container_name: syno-debrid
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # Owner of the files in ./data: the id of your DSM user (run `id` over SSH).
      PUID: 1026
      PGID: 100
      # Optional: the AllDebrid API key (it can also be entered in the Settings page).
      # ALLDEBRID_API_KEY: ''
      # Optional: no sign-in, when a reverse proxy authenticates every request (Authelia…).
      # AUTH: none
    volumes:
      - ./data:/data
